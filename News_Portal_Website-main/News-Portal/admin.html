<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | NewsPortal</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script>
        // Strict Admin Route Guard
        if (localStorage.getItem('userRole') !== 'admin') {
            window.location.href = 'index.html';
        }
    </script>
    <style>
        body { background: #0a0a0c; min-height: 100vh; overflow-x: hidden; }
        .admin-header {
            background: rgba(18, 18, 22, 0.9);
            border-bottom: 1px solid var(--border-color);
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .admin-header h1 { font-family: 'Outfit'; font-size: 1.5rem; }
        .admin-header h1 span { color: #ef4444; }
        .btn-group { display: flex; gap: 10px; }
        .btn {
            padding: 8px 16px; border-radius: 6px; border: none; font-family: 'Inter'; font-weight: 600; cursor: pointer; color: white;
        }
        .btn-blue { background: var(--accent-blue); }
        .btn-red { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.5); color: #ef4444; }
        
        .dashboard { padding: 40px 20px; max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 350px 1fr; gap: 30px; }
        @media (max-width: 768px) { .dashboard { grid-template-columns: 1fr; } }
        
        .card-panel { background: rgba(18,18,22,0.5); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; }
        .card-panel h2 { margin-bottom: 20px; font-family: 'Outfit'; border-bottom: 1px solid var(--border-color); padding-bottom: 10px; }
        
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; color: var(--text-secondary); font-size: 0.9rem; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 10px; border-radius: 6px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); color: white; font-family: 'Inter'; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus { border-color: var(--accent-blue); }
        
        .news-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .news-table th, .news-table td { padding: 12px; text-align: left; border-bottom: 1px solid var(--border-color); }
        .news-table th { color: var(--text-secondary); font-weight: 500; font-size: 0.9rem; }
        .news-table tr:hover { background: rgba(255,255,255,0.02); }
        .del-btn { background: #ef4444; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>
    <header class="admin-header">
        <h1>NewsPortal <span>Admin</span></h1>
        <div class="btn-group">
            <button class="btn btn-blue" id="liveSiteBtn">View Live Site</button>
            <button class="btn btn-red" id="logoutBtn">Logout</button>
            
        </div>
    </header>

    <div class="dashboard">
        <!-- Add News Form -->
        <div class="card-panel">
            <h2>Add New Article</h2>
            <form id="addNewsForm">
                <div class="form-group">
                    <label>Title</label>
                    <input type="text" id="newsTitle" required>
                </div>
                <div class="form-group">
                    <label>Category</label>
                    <select id="newsCategory" required>
                        <option value="world">World</option>
                        <option value="technology">Technology</option>
                        <option value="business">Business</option>
                        <option value="sports">Sports</option>
                        <option value="science">Science</option>
                        <option value="health">Health</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="human">Human Innovation ✨</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Author</label>
                    <input type="text" id="newsAuthor" required>
                </div>
                <div class="form-group">
                    <label>Image URL</label>
                    <input type="url" id="newsImage" placeholder="https://..." required>
                </div>
                <div class="form-group">
                    <label>Excerpt</label>
                    <textarea id="newsExcerpt" rows="4" required></textarea>
                </div>
                <button type="submit" class="btn btn-blue" style="width: 100%; margin-top: 10px;">Publish Article</button>
            </form>
        </div>

        <!-- Manage News Table -->
        <div class="card-panel">
            <h2>Manage Live Articles</h2>
            <div style="overflow-x: auto;">
                <table class="news-table" id="newsTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Category</th>
                            <th>Title</th>
                            <th>Author</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody id="newsTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="admin.js"></script>
</body>
</html>
